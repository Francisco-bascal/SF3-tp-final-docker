services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - red_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_datos:/var/lib/pgadmin
    networks:
      - red_backend
      - red_frontend
    depends_on:
      postgres:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_datos:/mosquitto/data
      - ./pruebas:/pruebas:ro
    networks:
      - red_backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.lab.test
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.lab.test:${PROXY_PUERTO}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - n8n_datos:/home/node/.n8n
    networks:
      - red_backend
      - red_frontend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  app:
    build: ./app
    restart: unless-stopped
    environment:
      ConnectionStrings__MediClock: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}
    networks:
      - red_backend
      - red_frontend
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PUERTO}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - red_frontend
    depends_on:
      - app
      - n8n
      - pgadmin

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_datos:/data
    networks:
      - red_backend

networks:
  red_frontend:
  red_backend:

volumes:
  portainer_datos:
  postgres_datos:
  pgadmin_datos:
  mosquitto_datos:
  n8n_datos:
