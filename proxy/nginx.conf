events {}

http {
    # DNS interno de Docker: resuelve los nombres de servicio en cada solicitud.
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cualquier otro nombre de host no configurado.
    server {
        listen 80 default_server;
        return 404;
    }

    server {
        listen 80;
        server_name app.lab.test;

        location / {
            set $destino http://app:8080;
            proxy_pass $destino;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        server_name n8n.lab.test;

        location / {
            set $destino http://n8n:5678;
            proxy_pass $destino;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # n8n usa WebSocket para la interfaz del editor.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 80;
        server_name db.lab.test;

        location / {
            set $destino http://pgadmin:80;
            proxy_pass $destino;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
